{% extends 'base.html' %}

{% block title %}Escáner de Asistencia - Long Hu He{% endblock %}

{% block content %}
<div x-data="scannerApp()" class="min-h-[70vh] flex flex-col items-center justify-center py-6">
    
    <!-- Encabezado -->
    <div class="text-center mb-10 space-y-2">
        <h2 class="text-6xl font-black uppercase text-white tracking-tighter italic">Lector <span class="text-orange-500">Zen</span></h2>
        <p class="text-white/20 font-black uppercase tracking-[0.6em] text-[10px]">Profesor: {{ request.user_obj.nombre_completo }}</p>
    </div>

    <!-- Contenedor del Escáner -->
    <div class="w-full max-w-md relative">
        <!-- Overlay de Feedback Visual -->
        <div x-show="feedback.active" 
             x-transition:enter="transition cubic-bezier(0.16, 1, 0.3, 1) duration-1000"
             x-transition:enter-start="opacity-0 scale-150 blur-3xl"
             x-transition:enter-end="opacity-100 scale-100 blur-0"
             class="absolute inset-0 z-20 flex flex-col items-center justify-center rounded-[3.5rem] p-8 text-center grainy-glass"
             :class="feedback.bgColor">
            
            <div class="bg-white/10 backdrop-blur-xl rounded-[2rem] p-8 mb-8 shadow-2xl border border-white/20 relative group">
                <div class="absolute inset-0 bg-white/20 rounded-[2rem] animate-ping opacity-20"></div>
                <template x-if="feedback.success">
                    <svg class="w-24 h-24 text-white relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                </template>
                <template x-if="!feedback.success">
                    <svg class="w-24 h-24 text-white relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </template>
            </div>

            <h3 class="text-5xl font-black text-white uppercase tracking-tighter leading-tight" x-text="feedback.title"></h3>
            <p class="text-white/70 font-black uppercase tracking-[0.3em] text-[10px] mt-4" x-text="feedback.message"></p>
            
            <!-- Info del Alumno (si tuvo éxito o tras acción) -->
            <template x-if="feedback.alumno">
                <div class="mt-10 glass-card rounded-[2.5rem] p-8 border-white/20 w-full relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white/40 to-transparent"></div>
                    <p class="text-[9px] uppercase font-black text-white/40 tracking-[0.5em] mb-3">Identidad Validada</p>
                    <p class="text-3xl font-black text-white tracking-tighter uppercase" x-text="feedback.alumno.nombre"></p>
                    <div class="inline-block mt-4 px-6 py-2 bg-black/40 rounded-full border border-white/5">
                        <p class="text-[10px] font-black text-orange-500 uppercase tracking-widest" x-text="feedback.alumno.grado"></p>
                    </div>
                </div>
            </template>

            <!-- Acciones Rápidas del Profesor (si el escaneo falló por cuota vencida) -->
            <template x-if="!feedback.success && feedback.alumnoId">
                <div class="mt-8 w-full space-y-3 z-30">
                    <p class="text-[9px] uppercase font-black text-white/50 tracking-[0.4em] mb-2">Acciones del Profesor</p>
                    
                    <!-- Botón Cobrar Efectivo -->
                    <button @click="ejecutarAccionScanner('cobrar-efectivo')" 
                            :disabled="feedback.cargandoAccion"
                            class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-white py-4 px-6 rounded-2xl font-black uppercase tracking-widest text-xs transition-all transform active:scale-95 flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(16,185,129,0.2)]">
                        <span x-show="!feedback.cargandoAccion">💵 Cobrar Efectivo ($<span x-text="feedback.montoEstimado"></span>)</span>
                        <span x-show="feedback.cargandoAccion">Procesando...</span>
                    </button>
                    
                    <!-- Botón Otorgar Prórroga -->
                    <button @click="ejecutarAccionScanner('otorgar-prorroga')"
                            :disabled="feedback.cargandoAccion"
                            class="w-full bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-white py-4 px-6 rounded-2xl font-black uppercase tracking-widest text-xs transition-all transform active:scale-95 flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(245,158,11,0.2)]">
                        <span x-show="!feedback.cargandoAccion">🛡️ Otorgar Prórroga (15 días)</span>
                        <span x-show="feedback.cargandoAccion">Procesando...</span>
                    </button>
                    
                    <!-- Botón Forzar Ingreso -->
                    <button @click="ejecutarAccionScanner('forzar-ingreso')"
                            :disabled="feedback.cargandoAccion"
                            class="w-full bg-white/10 hover:bg-white/20 disabled:opacity-50 text-white py-4 px-6 rounded-2xl font-black uppercase tracking-widest text-xs transition-all transform border border-white/10 active:scale-95 flex items-center justify-center gap-2">
                        <span x-show="!feedback.cargandoAccion">🚪 Forzar Asistencia (Clase Prueba)</span>
                        <span x-show="feedback.cargandoAccion">Procesando...</span>
                    </button>
                </div>
            </template>

            <button @click="resetFeedback" class="mt-12 bg-white text-black px-16 py-5 rounded-[2rem] font-black uppercase tracking-[0.3em] text-xs shadow-[0_20px_50px_rgba(255,255,255,0.3)] transform hover:scale-105 active:scale-95 transition-all duration-500 liquid-border">
                Continuar
            </button>
        </div>

        <!-- El Lector QR -->
        <div id="reader" class="overflow-hidden rounded-[3rem] border-4 border-white/10 bg-black/40 shadow-2xl aspect-square"></div>
        
        <!-- Instrucciones -->
        <div class="mt-8 text-center">
            <div class="inline-flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/5">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-[10px] font-black uppercase text-white/40 tracking-widest">Cámara Activa</span>
            </div>
            <p class="text-white/20 text-xs mt-4">Apunta la cámara al carnet del alumno</p>
        </div>
    </div>

</div>

<!-- Scripts -->
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
function scannerApp() {
    return {
        feedback: {
            active: false,
            success: false,
            title: '',
            message: '',
            bgColor: '',
            alumno: null,
            alumnoId: null,
            actividadId: null,
            montoEstimado: 0,
            cargandoAccion: false
        },
        scanner: null,

        init() {
            this.startScanner();
        },

        startScanner() {
            this.scanner = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            this.scanner.start(
                { facingMode: "environment" },
                config,
                (decodedText) => this.processScan(decodedText)
            ).catch(err => {
                console.error("Error iniciando cámara:", err);
                alert("No se pudo acceder a la cámara. Verifica los permisos.");
            });
        },

        async processScan(uuid) {
            if (this.feedback.active) return;

            try {
                const response = await fetch("{% url 'registrar_asistencia_qr' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uuid: uuid })
                });
                
                const result = await response.json();
                
                this.feedback.active = true;
                this.feedback.success = result.success;
                this.feedback.alumno = result.alumno;
                this.feedback.alumnoId = result.alumno_id || null;
                this.feedback.actividadId = result.actividad_id || null;
                this.feedback.montoEstimado = result.monto_estimado || 0;
                this.feedback.cargandoAccion = false;
                
                if (result.success) {
                    this.feedback.title = "¡ASISTENCIA OK!";
                    this.feedback.message = result.color === 'yellow' ? "Con advertencias médicas" : "Ingreso permitido";
                    this.feedback.bgColor = result.color === 'yellow' ? "bg-amber-500" : "bg-emerald-600";
                } else {
                    this.feedback.title = "ERROR";
                    this.feedback.message = result.message;
                    this.feedback.bgColor = result.color === 'red' ? "bg-rose-600" : "bg-orange-600";
                }

                // Sonido o vibración si el dispositivo lo permite
                if (window.navigator.vibrate) window.navigator.vibrate(200);

            } catch (err) {
                console.error("Error en el registro:", err);
            }
        },

        async ejecutarAccionScanner(tipo) {
            this.feedback.cargandoAccion = true;
            let url = "";
            let body = { alumno_id: this.feedback.alumnoId };
            
            if (tipo === 'cobrar-efectivo') {
                url = "{% url 'api_registrar_pago_efectivo_scanner' %}";
                body.actividad_id = this.feedback.actividadId;
            } else if (tipo === 'otorgar-prorroga') {
                url = "{% url 'api_otorgar_prorroga_scanner' %}";
            } else if (tipo === 'forzar-ingreso') {
                url = "{% url 'api_forzar_ingreso_scanner' %}";
            }
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const result = await response.json();
                
                if (result.success) {
                    this.feedback.success = true;
                    this.feedback.title = "¡ASISTENCIA OK!";
                    this.feedback.message = result.message;
                    this.feedback.bgColor = "bg-emerald-600";
                    this.feedback.alumno = {
                        nombre: result.message.split("para ")[1] || "Ingreso Registrado",
                        grado: tipo.replace('-', ' ').toUpperCase()
                    };
                } else {
                    alert("Error: " + result.message);
                }
            } catch (err) {
                console.error("Error al ejecutar acción del profesor:", err);
                alert("Error al conectar con el servidor.");
            } finally {
                this.feedback.cargandoAccion = false;
            }
        },

        resetFeedback() {
            this.feedback.active = false;
            this.feedback.alumno = null;
            this.feedback.alumnoId = null;
            this.feedback.actividadId = null;
            this.feedback.montoEstimado = 0;
            this.feedback.cargandoAccion = false;
        }
    }
}
</script>

<style>
    #reader video {
        object-fit: cover !important;
        width: 100% !important;
        height: 100% !important;
    }
    #reader__scan_region {
        background: transparent !important;
    }
    /* Estilo premium para el marco de html5-qrcode */
    #reader {
        border: none !important;
    }
</style>
{% endblock %}
